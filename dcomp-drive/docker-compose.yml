version: '3.8'

services:
  #todo: fazer 3 zookeepers
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper1
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    volumes:
      - ./zoo/data:/data
      - ./zoo/datalog:/datalog

  #DB para os metadados
  postgres:
    image: postgres:16
    container_name: dfs-postgres
    ports:
      - "5433:5432" # nao tava conseguindo com 5432:5432
    environment:
      POSTGRES_DB: dfs_metadata
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: postgre
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d dfs_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  controller:
    build: .
    container_name: dfs-controller
    command: python -m src.controller.controller_server
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      ZK_HOSTS: zookeeper:2181
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dfs_metadata
      DB_USER: postgre
      DB_PASSWORD: postgre
      SUSPECT_AFTER_S: "86400"
      DEAD_AFTER_S: "172800"
      MAX_DISK_USAGE: "0.9"
    ports:
      - "5000:5000"

  controller2:
    build: .
    container_name: dfs-controller-2
    profiles: ["ha"]
    command: python -m src.controller.controller_server
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    environment:
      ZK_HOSTS: zookeeper:2181
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dfs_metadata
      DB_USER: postgre
      DB_PASSWORD: postgre
      SUSPECT_AFTER_S: "86400"
      DEAD_AFTER_S: "172800"
      MAX_DISK_USAGE: "0.9"
    ports:
      - "5001:5000"

  storage-node-1:
    build: .
    container_name: dfs-storage-1
    user: "0:0"
    command: python -m src.storage.integrity_node --id node1 --host storage-node-1 --port 5555 --storage-path /data_blocks
    depends_on:
      - zookeeper
    environment:
      ZK_HOSTS: zookeeper:2181
    volumes:
      - ./data/node1:/data_blocks:Z
    ports:
      - "5555:5555"

  storage-node-2:
    build: .
    container_name: dfs-storage-2
    user: "0:0"
    command: python -m src.storage.integrity_node --id node2 --host storage-node-2 --port 5556 --storage-path /data_blocks   
    depends_on:
      - zookeeper
    environment:
      ZK_HOSTS: zookeeper:2181
    volumes:
      - ./data/node2:/data_blocks:Z
    ports:
      - "5556:5556"

  storage-node-3:
    build: .
    container_name: dfs-storage-3
    user: "0:0"
    command: python -m src.storage.integrity_node --id node3 --host storage-node-3 --port 5557 --storage-path /data_blocks
    depends_on:
      - zookeeper
    environment:
      ZK_HOSTS: zookeeper:2181
    volumes:
      - ./data/node3:/data_blocks:Z
    ports:
      - "5557:5557"

  storage-node-4:
    build: .
    container_name: dfs-storage-4
    user: "0:0"
    command: python -m src.storage.integrity_node --id node4 --host storage-node-4 --port 5558 --storage-path /data_blocks
    depends_on:
      - zookeeper
    environment:
      ZK_HOSTS: zookeeper:2181
    volumes:
      - ./data/node4:/data_blocks:Z
    ports:
      - "5558:5558"

  storage-node-5:
    build: .
    container_name: dfs-storage-5
    user: "0:0"
    command: python -m src.storage.integrity_node --id node5 --host storage-node-5 --port 5559 --storage-path /data_blocks
    depends_on:
      - zookeeper
    environment:
      ZK_HOSTS: zookeeper:2181
    volumes:
      - ./data/node5:/data_blocks:Z
    ports:
      - "5559:5559"

volumes:
  pg_data:
